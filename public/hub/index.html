<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Teams, table, fixtures, Tournament, seasons, history, performance and badges for your league." />
    <title>Teams · League Hub</title>
    <link rel="preload" href="krona-one.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="League Hub" />
    <script src="prefs.js?v=12"></script>
    <link rel="stylesheet" href="styles.css?v=13" />
    <link rel="stylesheet" href="components.css?v=59" />
  </head>
  <body>
    <div class="background" aria-hidden="true">
      <div class="glow"></div>
      <div class="bg-custom"></div>
      <div class="grid"></div>
    </div>

    <div class="app-intro" id="app-intro" role="presentation">
      <div class="intro-backdrop" aria-hidden="true"></div>
      <div class="intro-pattern" aria-hidden="true">
        <svg class="intro-pattern-svg" viewBox="0 0 1200 800" preserveAspectRatio="none">
          <defs>
            <linearGradient id="intro-line-gradient" gradientUnits="userSpaceOnUse" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0" style="stop-color:rgb(var(--glow-1));stop-opacity:1" />
              <stop offset=".48" style="stop-color:rgb(var(--accent-rgb));stop-opacity:1" />
              <stop offset="1" style="stop-color:rgb(var(--glow-g));stop-opacity:1" />
            </linearGradient>
            <radialGradient id="intro-triangle-fill" gradientUnits="userSpaceOnUse" cx="50%" cy="50%" r="72%">
              <stop offset="0" stop-color="#2A172E" />
              <stop offset=".62" stop-color="#140B17" />
              <stop offset="1" stop-color="#000000" />
            </radialGradient>
          </defs>
          <g class="intro-triangle-mesh"></g>
        </svg>
      </div>
      <div class="intro-brand" aria-hidden="true">
        <div class="intro-icon"><img src="logo.svg" alt=""></div>
        <div class="intro-details">
          <div class="intro-app-name">League Hub</div>
          <div class="intro-loader"><span></span></div>
        </div>
      </div>
    </div>

    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <button type="button" class="logo" data-brand-picker aria-label="Cambiar logo de la liga" title="Cambiar logo de la liga"></button>
          <span class="divider" aria-hidden="true"></span>
        </div>

        <nav class="nav" aria-label="Principal">
          <ul class="nav-list">
            <li class="nav-indicator" aria-hidden="true"></li>
            <li>
              <a class="nav-button" href="#teams" data-section="teams" aria-label="Teams">
                <span class="nav-icon" style="--icon: url('icon-teams.svg?v=4')"></span>
                <span class="tooltip" aria-hidden="true">Teams</span>
              </a>
            </li>
            <li>
              <a class="nav-button" href="#table" data-section="table" aria-label="Table">
                <span class="nav-icon" style="--icon: url('icon-table.svg?v=4')"></span>
                <span class="tooltip" aria-hidden="true">Table</span>
              </a>
            </li>
            <li>
              <a class="nav-button" href="#fixtures" data-section="fixtures" aria-label="Fixtures">
                <span class="nav-icon" style="--icon: url('icon-fixtures.svg?v=4')"></span>
                <span class="tooltip" aria-hidden="true">Fixtures</span>
              </a>
            </li>
            <li>
              <a class="nav-button" href="#tournament" data-section="tournament" aria-label="Tournament">
                <span class="nav-icon" style="--icon: url('icon-tournament.svg?v=5')"></span>
                <span class="tooltip" aria-hidden="true">Tournament</span>
              </a>
            </li>
            <li>
              <a class="nav-button" href="#seasons" data-section="seasons" aria-label="Seasons">
                <span class="nav-icon" style="--icon: url('icon-seasons.svg?v=4')"></span>
                <span class="tooltip" aria-hidden="true">Seasons</span>
              </a>
            </li>
            <li>
              <a class="nav-button" href="#history" data-section="history" aria-label="History">
                <span class="nav-icon" style="--icon: url('icon-history.svg?v=4')"></span>
                <span class="tooltip" aria-hidden="true">History</span>
              </a>
            </li>
            <li>
              <a class="nav-button" href="#performance" data-section="performance" aria-label="Performance">
                <span class="nav-icon" style="--icon: url('icon-performance.svg?v=4')"></span>
                <span class="tooltip" aria-hidden="true">Performance</span>
              </a>
            </li>
            <li>
              <a class="nav-button" href="#settings" data-section="settings" aria-label="Settings">
                <span class="nav-icon" style="--icon: url('icon-settings.svg?v=4')"></span>
                <span class="tooltip" aria-hidden="true">Settings</span>
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <main class="content">
        <section id="teams" class="section" aria-labelledby="teams-title">
          <h1 id="teams-title" class="section-title">Teams</h1>
          <div id="teams-body" class="section-body"></div>
        </section>
        <section id="table" class="section" aria-labelledby="table-title" hidden>
          <h1 id="table-title" class="section-title">Table</h1>
          <div id="table-body" class="section-body"></div>
        </section>
        <section id="fixtures" class="section" aria-labelledby="fixtures-title" hidden>
          <h1 id="fixtures-title" class="section-title">Fixtures</h1>
          <div id="fixtures-body" class="section-body"></div>
        </section>
        <section id="tournament" class="section" aria-labelledby="tournament-title" hidden>
          <h1 id="tournament-title" class="section-title">Tournament</h1>
          <div id="tournament-body" class="section-body"></div>
        </section>
        <section id="seasons" class="section" aria-labelledby="seasons-title" hidden>
          <h1 id="seasons-title" class="section-title">Seasons</h1>
          <div id="seasons-body" class="section-body"></div>
        </section>
        <section id="history" class="section" aria-labelledby="history-title" hidden>
          <h1 id="history-title" class="section-title">History</h1>
          <div id="history-body" class="section-body"></div>
        </section>
        <section id="performance" class="section" aria-labelledby="performance-title" hidden>
          <h1 id="performance-title" class="section-title">Performance</h1>
          <div id="performance-body" class="section-body"></div>
        </section>
        <section id="settings" class="section" aria-labelledby="settings-title" hidden>
          <h1 id="settings-title" class="section-title">Settings</h1>
          <div id="settings-body" class="section-body"></div>
        </section>
      </main>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title" class="dialog-title">¿Estás seguro?</h2>
        <p class="dialog-msg" data-msg></p>
        <div class="dialog-actions">
          <button class="btn btn--ghost" value="cancel">Cancelar</button>
          <button class="btn btn--danger" value="ok" data-ok>Confirmar</button>
        </div>
      </form>
    </dialog>

    <dialog id="logo-dialog" class="dialog dialog--wide" aria-labelledby="logo-dialog-title">
      <form method="dialog">
        <h2 id="logo-dialog-title" class="dialog-title" data-title>Elegir escudo</h2>
        <div class="logo-grid logo-grid--dialog" data-grid></div>
        <div class="dialog-actions">
          <button class="btn btn--ghost" value="cancel">Cancelar</button>
        </div>
      </form>
    </dialog>

    <script src="core.js?v=31" defer></script>
    <script src="views/teams.js?v=12" defer></script>
    <script src="views/table.js?v=18" defer></script>
    <script src="views/fixtures.js?v=14" defer></script>
    <script src="views/tournament.js?v=21" defer></script>
    <script src="views/seasons.js?v=29" defer></script>
    <script src="views/history.js?v=16" defer></script>
    <script src="views/performance.js?v=24" defer></script>
    <script src="views/badges.js?v=23" defer></script>
    <script src="views/settings.js?v=12" defer></script>
    <script src="app.js?v=23" defer></script>
  </body>
</html>
